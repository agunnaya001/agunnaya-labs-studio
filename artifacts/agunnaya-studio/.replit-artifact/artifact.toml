kind = "web"
previewPath = "/"
title = "Agunnaya AI Studio"
version = "1.0.0"
id = "artifacts/agunnaya-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20259

[services.development]
run = "pnpm --filter @workspace/agunnaya-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agunnaya-studio", "run", "build" ]
publicDir = "artifacts/agunnaya-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20259"
BASE_PATH = "/"
