kind = "mobile"
previewPath = "/agunnaya-studio-mobile/"
title = "Agunnaya AI Studio Mobile"
version = "1.0.0"
id = "artifacts/agunnaya-studio-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/agunnaya-studio-mobile/" ]
localPort = 19254

[services.development]
run = "pnpm --filter @workspace/agunnaya-studio-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agunnaya-studio-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/agunnaya-studio-mobile", "run", "serve" ]

[services.env]
PORT = "19254"
BASE_PATH = "/agunnaya-studio-mobile/"
